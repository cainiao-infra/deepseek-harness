# Standalone tool-free domain planner. The Python bridge supplies explicit invocation patches.
- insert:
    - id: sdk-app-startup
      name: '@deepseek-ai/dsh-sdk-app'
      config:
        profile: embodied-planner

    - id: sdk-jsonrpc-server
      name: '@deepseek-ai/dsh-sdk-jsonrpc-server'
      inject: [sdkAppStartup, loader]
      config:
        maxTokensAsSuccess: false

    - id: filesystem
      name: '@deepseek-ai/dsh-fs-local'

    - id: attachment-local
      name: '@deepseek-ai/dsh-attachment-local'

    - id: working-directory
      name: '@deepseek-ai/dsh-working-directory'

      config:
        includePromptContext: false

    - id: session-projection
      name: '@deepseek-ai/dsh-session-projection'

    - id: token-meter
      name: '@deepseek-ai/dsh-token-meter'

    - id: timer
      name: '@deepseek-ai/cordis-plugin-timer'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: session-title
      name: '@deepseek-ai/dsh-session-title'
      config:
        fallbackMaxWords: 5
        fallbackMaxBytes: 40
        maxTitleBytes: 80

    - id: system-prompt
      name: '@deepseek-ai/dsh-system-prompt'
      config:
        includeHarnessIdentity: false
        includeRuntimeContext: false

    - id: tools
      name: '@deepseek-ai/dsh-tools'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-retry
      name: '@deepseek-ai/dsh-llm-retry'

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents: []

    - id: sessions
      name: '@deepseek-ai/dsh-session-persistence-jsonl'
      config:
        root: !!js dshHomePath('sessions')
        compression: none

    - id: embodied-llm
      name: '@deepseek-ai/dsh-llm-pi-ai'

    - id: embodied-planner
      name: '@deepseek-ai/dsh-experimental-embodied-planner'
      config:
        temperature: 0
